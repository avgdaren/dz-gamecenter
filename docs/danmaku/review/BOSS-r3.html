<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星环观测者 · 动态与三阶段预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#101929;color:#dce4f2;font:14px/1.7 system-ui,sans-serif}main{max-width:930px;margin:auto;padding:24px}h1{font-size:25px;color:#f0d4a1;font-weight:500}p{color:#aebed4;max-width:750px}a{color:#cddcf8}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button{background:#1d2b44;color:#dce4f2;border:1px solid #4f607c;padding:10px 13px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#3b4050;border-color:#d6bd88;color:#f9dfaf}.layout{display:grid;grid-template-columns:minmax(0,480px) minmax(0,280px);gap:32px;align-items:start}canvas{display:block;width:100%;height:auto;border:1px solid #4a5871;background:#121e32;border-radius:4px}#zoom{image-rendering:pixelated;max-width:288px;margin-top:12px}h2{font-size:18px;font-weight:500;color:#d8c19b}#note{min-height:84px}.settings{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:14px 0;font-size:12px}input[type=range]{width:160px}small{color:#a3b6d0}footer{font-size:12px;color:#879bb6;margin:22px 0}@media(max-width:650px){main{padding:16px}.layout{grid-template-columns:minmax(0,1fr)}.controls button{flex:1;font-size:12px;padding:10px 6px}h1{font-size:21px}.sidebar{max-width:320px}#zoom{max-width:260px}}
</style></head><body><main><h1>星环观测者 · 动态与三阶段</h1><p>同一套实际弹幕生成代码的独立形态预览，便于快速比较。下方固定目标点仅供观察，不计分，也不代替实际试玩。</p><div class="controls"><button data-phase="0" aria-pressed="true">Ⅰ 双层花环</button><button data-phase="1" aria-pressed="false">Ⅱ 锁定针雨</button><button data-phase="2" aria-pressed="false">Ⅲ 金色星门</button></div><div class="layout"><section><canvas id="field" width="480" height="640" aria-label="弹幕形态"></canvas><div class="settings"><button id="toggle">暂停</button><label><input id="reduced" type="checkbox"> 简化动态</label><label>时间 <input id="time" type="range" min="0" max="720" value="0"></label></div><small id="clock"></small></section><aside class="sidebar"><h2 id="title"></h2><p id="note"></p><h2>身体局部放大</h2><p>固定身体位置观察发梢、袖口和裙摆；腰部中心与脸部保持稳定。</p><canvas id="zoom" width="144" height="160" aria-label="仅身体动态，不含旋转星环"></canvas><p><a href="../../../source/plugin/gamecenter/games/_danmaku_proto/index.html">打开新版完整试玩</a></p></aside></div><footer>原型 (C) 2026 Carinoasd · 制作与接入：小典 / Codex。图像沿用已确认素材。</footer></main>
<script src="../../../source/plugin/gamecenter/games/_danmaku_proto/rules-data.js"></script><script src="../../../source/plugin/gamecenter/games/_danmaku_proto/engine.js"></script><script src="../../../source/plugin/gamecenter/games/_danmaku_proto/boss-patterns.js"></script><script src="../../../source/plugin/gamecenter/games/_danmaku_proto/battle.js"></script><script src="../../../source/plugin/gamecenter/games/_danmaku_proto/boss-view.js"></script>
<script>
(function(){'use strict';
var rules=DanmakuRules,view=DanmakuBossView,field=document.getElementById('field'),ctx=field.getContext('2d'),zoom=document.getElementById('zoom'),z=zoom.getContext('2d');
var images={},phase=0,tick=0,paused=false,sim,last=performance.now(),acc=0,motionTick=null,renderTimes=[];
var descriptions=['青色空心弹组成两层扩散花环，保留朝下的宽缺口；慢速展开，分辨整体环形。','紫色针弹先锁定、再连续发射；引开瞄准线后换位，攻击集中成束。','金色星弹排成多道幕墙，宽星门按轮次换边，间歇加入两侧斜射。'];
Object.keys(view.assets).forEach(function(k){var i=new Image();i.src='../../../source/plugin/gamecenter/games/_danmaku_proto/'+view.files[k];images[k]=i;});
function reset(i){phase=i;tick=0;sim=new DanmakuBattle.Phase(rules,i,false,true,true);sim.player.x=240*64;sim.player.y=540*64;motionTick=null;document.getElementById('title').textContent=['双层花环','锁定针雨','金色星门'][i];document.getElementById('note').textContent=descriptions[i];document.querySelectorAll('[data-phase]').forEach(function(b){b.setAttribute('aria-pressed',Number(b.dataset.phase)===i?'true':'false');});}
function step(){tick++;sim.tick=tick;sim.boss.px=sim.boss.x;sim.boss.x=DanmakuP0.bossX(tick);sim.pattern();sim.enemies.forEach(function(e){e.x+=e.vx;e.y+=e.vy;});sim.enemies=sim.enemies.filter(function(e){return tick-e.born<480&&e.x>=-2048&&e.x<=32768&&e.y>=-2048&&e.y<=43008;});}
function render(){var started=performance.now(),simple=document.getElementById('reduced').checked;ctx.fillStyle='#111e32';ctx.fillRect(0,0,480,640);ctx.strokeStyle='#263951';ctx.beginPath();ctx.moveTo(12,144);ctx.lineTo(468,144);ctx.stroke();
if(sim.tick<sim.warningUntil){var v=rules.directionVectors[sim.aimAngle];ctx.strokeStyle='#ad8cde';ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(sim.boss.x/64,88);ctx.lineTo(sim.boss.x/64+v[0],88+v[1]);ctx.stroke();ctx.setLineDash([]);}
view.sprite(ctx,images,sim,tick,simple,'active');sim.enemies.forEach(function(e){DanmakuBossPatterns.bullet(ctx,e,phase);});ctx.strokeStyle='#f9d1db';ctx.beginPath();ctx.arc(240,540,5,0,Math.PI*2);ctx.stroke();
z.fillStyle='#15233b';z.fillRect(0,0,144,160);if(view.ready(images)){z.save();z.translate(24,16);view.body(z,images.body,motionTick===null?tick:motionTick,simple);z.restore();}
document.getElementById('clock').textContent=(tick/60).toFixed(1)+'秒 · 当前'+sim.enemies.length+'枚';document.getElementById('time').value=tick;renderTimes.push(performance.now()-started);if(renderTimes.length>120)renderTimes.shift();}
function seek(i,t){reset(i);for(var n=0;n<t;n++)step();paused=true;document.getElementById('toggle').textContent='继续';render();}
document.querySelectorAll('[data-phase]').forEach(function(b){b.onclick=function(){reset(Number(b.dataset.phase));render();};});document.getElementById('toggle').onclick=function(){paused=!paused;document.getElementById('toggle').textContent=paused?'继续':'暂停';};document.getElementById('time').oninput=function(){seek(phase,Number(this.value));};document.getElementById('reduced').onchange=render;
window.BossR3Review={seek:seek,motion:function(t){motionTick=t;render();},inspect:function(){return{ready:view.ready(images),phase:phase,tick:tick,paused:paused,live:sim.enemies.length,renderTimes:renderTimes.slice()};}};
reset(0);function frame(now){acc+=Math.min(50,now-last);last=now;if(!paused){while(acc>=1000/60){step();acc-=1000/60;if(tick>=720)reset(phase);}}else acc=0;render();requestAnimationFrame(frame);}requestAnimationFrame(frame);
}());
</script></body></html>
