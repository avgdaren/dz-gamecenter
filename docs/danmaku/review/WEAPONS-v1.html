<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>武器与爆散 · 定点预览</title><link rel="icon" href="data:,"><base href="../../../source/plugin/gamecenter/games/_danmaku_proto/">
<style>body{margin:0;background:#0b1424;color:#d5e4f4;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:920px;margin:20px auto;padding:0 15px}h1{font-size:22px;color:#eed8ab}p{font-size:12px;color:#9fb7cd}section{display:flex;gap:22px;align-items:flex-start}canvas{width:min(480px,65vw);height:auto;display:block;border:1px solid #5c7797;aspect-ratio:3/4}nav{display:grid;gap:10px;flex:1}button{font:inherit;color:#d5e4f4;background:#1d3048;border:1px solid #607991;padding:10px;cursor:pointer}button[aria-pressed=true]{color:#f5d89f;border-color:#f5d89f}label,output{font-size:12px}output{white-space:pre-line;color:#bad0e5}@media(max-width:600px){section{flex-direction:column}canvas{width:100%;max-width:480px}nav{display:flex;flex-wrap:wrap}button{font-size:12px}output{width:100%}}</style>
<script defer src="rules-data.js"></script><script defer src="engine.js"></script><script defer src="boss-patterns.js"></script><script defer src="battle.js"></script><script defer src="weapons.js"></script><script defer src="stage.js"></script><script defer src="stage-show.js"></script><script defer src="stage-view.js"></script><script defer src="boss-view.js"></script><script defer src="player-view.js"></script></head>
<body><main><h1>武器与爆散 · 定点预览</h1><p>独立展示页，调用正式武器与特效模块。固定靶不攻击、不计成绩；可暂停逐看，不需要通关。</p><section><canvas id="preview" width="480" height="640" aria-label="武器与特效画面"></canvas><nav aria-label="展示项目"><button data-demo="laser4" aria-pressed="true">4级低速弹束</button><button data-demo="homing" aria-pressed="false">5级高速追踪</button><button data-demo="laser5" aria-pressed="false">5级低速弹束</button><button data-demo="bomb" aria-pressed="false">大招羽翼与光环</button><button data-demo="phase1" aria-pressed="false">Boss 转场一</button><button data-demo="phase2" aria-pressed="false">Boss 转场二</button><button id="freeze">暂停展示</button><button id="replay">重新播放</button><button id="peak">停在特效峰值</button><label><input id="reduced" type="checkbox"> 简化动态效果</label><output id="caption"></output></nav></section></main>
<script>
window.addEventListener('DOMContentLoaded',function(){
 'use strict';var r=window.DanmakuRules,S=window.DanmakuStage01,W=window.DanmakuWeapons,Show=window.DanmakuStageShow,ctx=document.getElementById('preview').getContext('2d');
 var choice='laser4',age=0,paused=false,last=0,acc=0,sim,showState,battle,images={},player=new Image();player.src='assets/player-motion-v1.png';
 Object.keys(DanmakuBossView.files).forEach(function(name){var image=new Image();image.src=DanmakuBossView.files[name];images[name]=image;});
 function reset(){age=0;acc=0;sim=new S.Sim(r,0,false,S.normalWeaponRule);sim.player.power=choice==='laser4'?12:16;sim.player.x=sim.player.px=240*64;sim.player.y=sim.player.py=550*64;sim.hp=1000000;sim.player.invulUntil=1000000;sim.pattern=function(){this.boss.x=Math.round((240+Math.sin(this.tick/60)*100)*64);};showState=Show.create();showState.breakOrigin=[240,88];battle={rules:r,stage:'transition',phaseIndex:choice==='phase2'?2:1,phaseBreaks:choice==='phase2'?2:1,remaining:120,sim:sim};document.getElementById('caption').textContent={laser4:'4级 · 三路收束弹，18px/帧\n每4帧20伤害，全部命中300/秒',laser5:'5级 · 三路收束弹，24px/帧\n每2帧14伤害，全部命中420/秒',homing:'5级高速 · 7路直射 + 4路追踪\n绿色弹转向移动靶，目标消失后重新索敌',bomb:'扩散光环、羽翼展开、纵向光柱\n清弹、伤害和无敌时间沿用原值',phase1:'Ⅰ → Ⅱ · 1号冷青爆散\n短促震屏与单次闪光，保留2秒转换',phase2:'Ⅱ → Ⅲ · 同款1号冷青爆散\n短促震屏与单次闪光，暂停冻结'}[choice];}
 function step(){age++;
 if(choice.startsWith('phase')){sim.tick=age;battle.remaining=120-Math.min(age,120);if(age>165)reset();}
 else{sim.step({dx:0,dy:0,flags:choice==='homing'?0:choice==='bomb'?(age===1?2:0):1});if(age>(choice==='bomb'?r.stage01.bomb.clearTicks+45:360))reset();}}
 function draw(){var reduced=document.getElementById('reduced').checked,model=choice.startsWith('phase')?Show.model(showState,battle,reduced):null;ctx.clearRect(0,0,480,640);Show.begin(ctx,model);ctx.fillStyle='#101e35';ctx.fillRect(0,0,480,640);ctx.fillStyle='#587699';for(var i=0;i<55;i++)ctx.fillRect((i*137+23)%480,(i*193+37)%640,1,1);ctx.strokeStyle='#3c5573';ctx.beginPath();ctx.moveTo(25,144);ctx.lineTo(455,144);ctx.stroke();
 DanmakuBossView.sprite(ctx,images,sim,age,reduced,choice.startsWith('phase')?'transition':'active',model);
 if(model)Show.effects(ctx,model,reduced);
 sim.shots.forEach(function(s){if(s.kind===1||s.kind===2)W.drawShot(ctx,s,reduced);else{ctx.fillStyle='#9ad8ed';ctx.fillRect(s.x/64-1.5,s.y/64-6,3,12);}});
 if(player.complete&&player.naturalWidth)DanmakuPlayerView.sprite(ctx,player,sim.player,age);
 if(choice==='bomb')DanmakuStageView.bomb(ctx,sim,reduced);DanmakuPlayerView.hitpoint(ctx,sim.player,choice!=='homing');Show.end(ctx,model);}
 function frame(now){if(!last)last=now;if(!paused&&!document.hidden){acc+=Math.min(50,now-last);while(acc>=1000/60){acc-=1000/60;step();}}last=now;draw();requestAnimationFrame(frame);}
 document.querySelectorAll('[data-demo]').forEach(function(b){b.addEventListener('click',function(){choice=b.dataset.demo;paused=false;document.getElementById('freeze').textContent='暂停展示';document.querySelectorAll('[data-demo]').forEach(function(v){v.setAttribute('aria-pressed',String(v===b));});reset();});});
 document.getElementById('freeze').onclick=function(){paused=!paused;this.textContent=paused?'继续展示':'暂停展示';};document.getElementById('replay').onclick=reset;document.getElementById('peak').onclick=function(){if(choice==='bomb'){reset();sim.step({dx:0,dy:0,flags:2});sim.tick=15;age=15;}else if(choice.startsWith('phase')){age=18;battle.remaining=102;}else return;paused=true;document.getElementById('freeze').textContent='继续展示';};reset();requestAnimationFrame(frame);
});
</script></body></html>
