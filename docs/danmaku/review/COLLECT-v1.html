<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道中收集物 · 定点预览</title><link rel="icon" href="data:,"><base href="../../../source/plugin/gamecenter/games/_danmaku_proto/">
<style>body{margin:0;background:#0b1424;color:#d5e4f4;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:920px;margin:20px auto;padding:0 15px}h1{font-size:22px;color:#eed8ab}p{font-size:12px;color:#9fb7cd}section{display:flex;gap:22px;align-items:flex-start}canvas{width:min(480px,65vw);height:auto;border:1px solid #5c7797;aspect-ratio:3/4}nav{display:grid;gap:10px;flex:1}button{font:inherit;color:#d5e4f4;background:#1d3048;border:1px solid #607991;padding:10px;cursor:pointer}button[aria-pressed=true]{color:#f5d89f;border-color:#f5d89f}label,output{font-size:12px}output{white-space:pre-line;color:#bad0e5}@media(max-width:600px){section{flex-direction:column}canvas{width:100%;max-width:480px}nav{display:flex;flex-wrap:wrap}button{font-size:12px}output{width:100%}}</style>
<script defer src="rules-data.js"></script><script defer src="engine.js"></script><script defer src="boss-patterns.js"></script><script defer src="battle.js"></script><script defer src="weapons.js"></script><script defer src="stage.js"></script><script defer src="stage-show.js"></script><script defer src="stage-view.js"></script><script defer src="player-view.js"></script></head>
<body><main><h1>道中收集物 · 定点预览</h1><p>固定靶独立展示，调用正式掉落、拾取与绘制模块，不计成绩，不需要通关。</p><section><canvas id="preview" width="480" height="640" aria-label="道具与火力展示"></canvas><nav aria-label="展示项目"><button data-demo="drops" aria-pressed="true">查看 P／积分晶体／B</button><button id="collect">拾取展示中的道具</button><button data-demo="laser4" aria-pressed="false">4级低速原样式</button><button data-demo="laser5" aria-pressed="false">5级低速原样式</button><button data-demo="homing" aria-pressed="false">5级高速短追踪弹</button><button id="freeze">暂停展示</button><button id="replay">重新播放</button><label><input id="reduced" type="checkbox"> 简化动态效果</label><output id="caption"></output></nav></section></main>
<script>
window.addEventListener('DOMContentLoaded',function(){
 'use strict';var r=window.DanmakuRules,S=window.DanmakuStage01,W=window.DanmakuWeapons,ctx=document.getElementById('preview').getContext('2d'),choice='drops',paused=false,age=0,acc=0,last=0,sim,b,player=new Image();player.src='assets/player-motion-v1.png';
 function mob(birth,x){return{id:birth.id,type:birth.type,born:0,baseX:0,mirror:false,reward:birth.reward,x:x*64,y:425*64,px:x*64,py:425*64,hp:sim.rules.stage01.types[birth.type].hp,aim:128,warningUntil:0,warningKind:0};}
 function reset(){age=0;acc=0;b=new S.Stage(r,false,S.normalCollectRule);if(choice!=='drops')b.replace(0);sim=b.sim;sim.player.x=sim.player.px=240*64;sim.player.y=sim.player.py=550*64;sim.player.power=choice==='laser4'?12:choice==='drops'?0:16;sim.player.invulUntil=1000000;sim.hp=choice==='drops'?0:1000000;sim.pattern=function(){if(this.index>=0)this.boss.x=Math.round((240+Math.sin(this.tick/60)*100)*64);};if(choice==='drops'){var births=sim.rules.stage01.schedule;sim.mobs=[mob(births.find(m=>m.id===2),160),mob(births.find(m=>m.id===1),240),mob(births.find(m=>m.type===2),320)];sim.mobs.slice().forEach(m=>sim.damageMob(m,10000,false));sim.mobs=[];sim.drops.forEach(function(d){if(d.kind===1)d.x=d.px=365*64;});}paused=choice==='drops';document.getElementById('freeze').textContent=paused?'继续展示':'暂停展示';document.getElementById('collect').disabled=choice!=='drops';caption();}
 function caption(){document.getElementById('caption').textContent=choice==='drops'?'道中总P：18 → 26\n不掉P的20只敌人各掉1颗蓝色积分晶体\n积分晶体拾取：'+sim.stats.pointCollected+'，增加 '+b.score().points+' 分\n当前火力：'+S.level(sim.player.power,sim.rules)+'级，大招：'+sim.player.bombs+'枚':choice==='homing'?'高速保留短追踪弹，无长拖尾。':'低速绿色直射恢复上一版弹形与拖尾。\n中央收束弹与覆盖宽度保留。';}
 function step(){age++;if(choice==='drops'){sim.tick=age;sim.items({flags:1});if(age>420)reset();}else{sim.step({dx:0,dy:0,flags:choice==='homing'?0:1});if(age>360)reset();}caption();}
 function draw(){var reduced=document.getElementById('reduced').checked;ctx.fillStyle='#101e35';ctx.fillRect(0,0,480,640);ctx.fillStyle='#587699';for(var i=0;i<55;i++)ctx.fillRect((i*137+23)%480,(i*193+37)%640,1,1);if(choice!=='drops'){ctx.strokeStyle='#c9bd99';ctx.beginPath();ctx.arc(sim.boss.x/64,88,28,0,Math.PI*2);ctx.stroke();}DanmakuStageView.field(ctx,sim,{},reduced);sim.shots.forEach(function(s){if(s.kind===1||s.kind===2||s.kind===3)W.drawShot(ctx,s,reduced);else{ctx.fillStyle='#9ad8ed';ctx.fillRect(s.x/64-1.5,s.y/64-6,3,12);}});if(player.complete&&player.naturalWidth)DanmakuPlayerView.sprite(ctx,player,sim.player,age);DanmakuStageView.feedback(ctx,sim);DanmakuPlayerView.hitpoint(ctx,sim.player,choice!=='homing');}
 function frame(now){if(!last)last=now;if(!paused&&!document.hidden){acc+=Math.min(50,now-last);while(acc>=1000/60){acc-=1000/60;step();}}last=now;draw();requestAnimationFrame(frame);}
 document.querySelectorAll('[data-demo]').forEach(function(button){button.onclick=function(){choice=button.dataset.demo;document.querySelectorAll('[data-demo]').forEach(v=>v.setAttribute('aria-pressed',String(v===button)));reset();};});
 document.getElementById('collect').onclick=function(){if(choice!=='drops')return;sim.drops.forEach(function(d){d.x=d.px=sim.player.x;d.y=d.py=sim.player.y;d.unlock=0;});sim.items({flags:1});paused=true;document.getElementById('freeze').textContent='继续展示';caption();};document.getElementById('freeze').onclick=function(){paused=!paused;this.textContent=paused?'继续展示':'暂停展示';};document.getElementById('replay').onclick=reset;reset();requestAnimationFrame(frame);
});
</script></body></html>
