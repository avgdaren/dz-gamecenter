<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下一次增量候选 · 新生物与玩法预研</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5f8;color:#243f52;font:16px/1.7 system-ui}main{max-width:1080px;margin:auto;padding:24px 18px}h1{font-size:26px}.note{padding:14px;background:#fff4da;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:white;border-radius:14px;padding:16px}.art{height:260px;background:#d9f3ed;display:flex;justify-content:center;align-items:center;border-radius:9px}.dark .art{background:#163353}.art img{max-width:95%;max-height:250px}button{font:inherit;background:#237d91;color:white;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}a{color:#19758c}h2{font-size:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><main><h1>新生物与下一次更新候选</h1><p class="note">这是静态美术/研究预览。4种是候选，不代表已加入线上鱼池；四种导出已看过深浅底合成，动态、真实水景和其他新形象仍需验收。</p><button id="tone">切换深色检查</button><div class="grid" id="cards"></div><h2>玩法预研</h2><p>普通喂养免费、无限、无饥饿惩罚。可选互动奖励建议为投喂回应120、水面漂流瓶60，分别成功领取后冷却24小时；本包没有实现发奖。</p><p><a href="FEEDING-DESIGN-v0.2.md">喂养方案</a> · <a href="ACTIVE-INCOME-DESIGN-v0.1.md">操作收入方案</a> · <a href="ECONOMY-NOTES.md">数值参照</a> · <a href="RELEASE-HANDOFF.md">小蓝交接</a></p></main><script>const items=[{"id": "pond_curl_seahorse", "name": "卷尾海马", "description": "尾巴总卷成一个小问号，慢慢巡视水草的边缘。", "motion": "upright_hover", "image": "../../../source/plugin/gamecenter/games/aquarium/assets/fish-next/v1/pond_curl_seahorse_sprite.webp"}, {"id": "pond_bell_jelly", "name": "铃伞水母", "description": "小伞轻轻收拢，像一枚在水里缓慢摇响的铃。", "motion": "vertical_pulse", "image": "../../../source/plugin/gamecenter/games/aquarium/assets/fish-next/v1/pond_bell_jelly_sprite.webp"}, {"id": "bay_gummy_octopus", "name": "软糖章鱼", "description": "八只小腕轻轻一抱，仿佛整团软糖都浮了起来。", "motion": "low_glide", "image": "../../../source/plugin/gamecenter/games/aquarium/assets/fish-next/v1/bay_gummy_octopus_sprite.webp"}, {"id": "bay_moon_mermaid", "name": "月汐人鱼", "description": "长发随水流轻轻舒展，像把月色带进了浅湾。", "motion": "horizontal_glide", "image": "../../../source/plugin/gamecenter/games/aquarium/assets/fish-next/v1/bay_moon_mermaid_sprite.webp"}];const cards=document.querySelector('#cards');for(const item of items){const card=document.createElement('article');card.className='card';const art=document.createElement('div');art.className='art';const im=document.createElement('img');im.src=item.image;im.alt=item.name;art.append(im);const name=document.createElement('h2');name.textContent=item.name;const desc=document.createElement('p');desc.textContent=item.description;card.append(art,name,desc);cards.append(card);}document.querySelector('#tone').addEventListener('click',()=>document.body.classList.toggle('dark'));</script></html>
