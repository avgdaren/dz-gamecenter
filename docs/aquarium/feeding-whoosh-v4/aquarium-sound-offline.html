let current=null,timer=null,serial=0;const status=document.getElementById('status'),vol=document.getElementById('vol');
function stop(){serial++;if(timer!==null){clearTimeout(timer);timer=null}if(current){current.onended=null;current.pause();current=null}document.querySelectorAll('button.active').forEach(b=>b.classList.remove('active'))}
function play(clip,count,button){stop();const token=serial;let left=count;const a=new Audio(clip.src);current=a;a.volume=Number(vol.value);button.classList.add('active');
 function failed(){if(token!==serial)return;stop();status.textContent='播放未成功，请再点一次；也可下载离线页用浏览器打开。'}
 function once(){if(token!==serial)return;left--;a.currentTime=0;status.textContent='正在试听 咻'+clip.id.slice(-2)+' · '+clip.label+(count>1?'（第'+(count-left)+'次）':'');a.play().catch(failed)}
 a.onended=()=>{if(token!==serial)return;if(left>0){timer=setTimeout(()=>{timer=null;once()},380)}else{current=null;button.classList.remove('active');status.textContent='咻'+clip.id.slice(-2)+' 播放结束。选好后告诉我编号即可。'}};a.onerror=failed;once()}
clips.forEach(c=>{const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent='咻'+c.id.slice(-2)+' · '+c.label;const meta=document.createElement('p');meta.className='meta';meta.textContent=c.ms+' ms';const row=document.createElement('div');row.className='row';[1,3].forEach(n=>{const b=document.createElement('button');b.textContent=n===1?'播放':'连听三次';if(n===3)b.className='secondary';b.onclick=()=>play(c,n,b);row.append(b)});card.append(h,meta,row);document.getElementById('clips').append(card)});
document.getElementById('stop').onclick=()=>{stop();status.textContent='已停止。'};vol.oninput=()=>{if(current)current.volume=Number(vol.value)};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);
</script></html>
